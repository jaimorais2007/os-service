
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: oficina
  labels:
    app: os-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: os-service

  template:
    metadata:
      labels:
        app: os-service

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: os-service
          image: ghcr.io/jaimorais2007/os-service:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: OTEL_SERVICE_NAME
              value: os-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://otlp.nr-data.net
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: gzip
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
              value: "4095"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
            # Chave que valida o JWT da Lambda de autenticação. Obrigatória: sem ela o pod não sobe.
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: Jwt__Secret
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"

            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: CONNECTION_STRING

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS__Region
              value: "us-east-1"

            - name: AWS__SqsQueueUrl
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: SQS_QUEUE_URL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi

            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
