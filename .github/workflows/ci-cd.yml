# Workflow do execution-service: chama o pipeline reutilizável do ci-templates.
# Para billing-service e execution-service, copie este arquivo e troque
# service-name e sonar-project-key.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pipeline:
    uses: jaimorais2007/ci-templates/.github/workflows/dotnet-service.yml@main
    with:
      service-name: execution-service
      sonar-project-key: jaimorais2007_execution-service
      # deploy: true   # ativar quando o cluster e o secret KUBE_CONFIG existirem
    permissions:
      contents: read
      packages: write
    secrets: inherit
