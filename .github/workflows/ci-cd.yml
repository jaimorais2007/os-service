# Workflow do os-service: chama o pipeline reutilizável do ci-templates.
# Para billing-service e execution-service, copie este arquivo e troque
# service-name e sonar-project-key.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pipeline:
    uses: jaimorais2007/ci-templates/.github/workflows/dotnet-service.yml@main
    with:
      service-name: os-service
      sonar-project-key: jaimorais2007_os-service
      deploy: true
    permissions:
      contents: read
      packages: write
    secrets: inherit
